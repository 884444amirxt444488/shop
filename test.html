<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .mainGetRound {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            inset: 0;
            background-color: rgb(20, 0, 0);
        }

        @property --angle {
            syntax: "<angle>";
            initial-value: 60deg;
            inherits: false;
        } 
        .getRound {
            width: 30px;
            height: 30px;
            background: conic-gradient(
                from 0deg,
                rgb(208, 255, 0) 0 var(--angle),
                rgba(255, 0, 0, 0) var(--angle) 360deg
            );
            border-radius: 50%;
            -webkit-mask: radial-gradient(transparent 60%, black 50%);
            mask: radial-gradient(transparent 60%, black 50%);
            animation: rotateYe 2s linear infinite forwards;
        }
        @keyframes rotateYe {
            0% {
                --angle: 60deg;
                rotate: 0;
            }
            50% {
                --angle: 300deg;
                rotate: 360deg;
            }
            100% {
                --angle: 60deg;
                rotate: 720deg;
            }
        }





    </style>
</head>
<body>

    <button class="btn">
        <div class="mainGetRound">
            <span class="getRound"></span>
        </div>
    </button>


    
</body>
</html>
